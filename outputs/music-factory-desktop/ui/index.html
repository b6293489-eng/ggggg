<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src 'self' blob: http://127.0.0.1:*; connect-src 'self' http://127.0.0.1:*; frame-src 'none'; object-src 'none'; base-uri 'none'">
  <meta name="color-scheme" content="dark">
  <title>Music Factory</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="readability.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" aria-label="Навигация">
      <a class="brand" href="#overview" aria-label="Music Factory — пульт"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span>music<span class="brand-light">factory</span><small>YOUR INDEPENDENT STUDIO</small></span></a>
      <span class="nav-caption">РАБОЧЕЕ ПРОСТРАНСТВО</span>
      <nav id="navigation"></nav>
      <div class="sidebar-bottom"><div id="connection-indicator" class="connection-indicator"><span class="status-dot"></span>Соединение…</div><button class="text-button" data-action="openLogs">Журнал приложения <span>↗</span></button><span class="version" id="app-version">Music Factory · desktop</span></div>
    </aside>
    <div class="main-shell">
      <header class="topbar"><div class="breadcrumb">Workspace <span>/</span> <strong id="page-name">Пульт</strong></div><div class="topbar-actions"><span class="local-badge"><span class="status-dot good"></span>Локальная студия</span><button class="icon-button" data-action="refresh" title="Обновить данные" aria-label="Обновить данные"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6 7a7 7 0 0 1 12-1l2 3M4 15l2 3a7 7 0 0 0 12-1"/></svg></button></div></header>
      <main id="main" tabindex="-1"><div class="loading-state"><div class="spinner"></div><h1>Открываем студию</h1><p>Загружаем ваши треки и аккаунты.</p></div></main>
    </div>
  </div>
  <div id="player" class="player" hidden><div class="player-track"><div class="track-cover" id="player-cover" aria-hidden="true">♫</div><div><strong id="player-title"></strong><small id="player-account"></small></div></div><div class="player-controls"><button class="icon-button" data-action="previousTrack" title="Предыдущий трек" aria-label="Предыдущий трек">⏮</button><button class="play-button" id="player-toggle" data-action="togglePlayback" aria-label="Воспроизвести">▶</button><button class="icon-button" data-action="nextTrack" title="Следующий трек" aria-label="Следующий трек">⏭</button><span id="player-time">0:00</span><input type="range" id="player-seek" min="0" max="1000" value="0" aria-label="Позиция воспроизведения"><span id="player-duration">0:00</span></div><button class="icon-button player-close" data-action="closePlayer" title="Закрыть плеер" aria-label="Закрыть плеер">×</button><audio id="audio" preload="metadata"></audio></div>
  <dialog id="dialog" aria-labelledby="dialog-title"><div id="dialog-content"></div></dialog>
  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>
  <script src="app.js"></script>
</body>
</html>
