<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Music Factory</title><link rel="stylesheet" href="popup.css"></head>
<body><main><small>MUSIC FACTORY · CHROME BRIDGE</small><h1>Этот аккаунт<br>в твоей ферме.</h1><p>Подключи расширение отдельно в каждом из трёх уже залогиненных профилей Chrome.</p>
<form id="pair"><label for="account">Аккаунт этого профиля</label><select id="account"><option value="bos">Бос</option><option value="gleb">Gleb fps</option><option value="rivi">Rivi</option></select><label for="token">Код из Factory → Аккаунты</label><input id="token" type="password" autocomplete="off" placeholder="Вставить код подключения" required><button type="submit">Подключить</button></form>
<div id="status" role="status" aria-live="polite">Проверка связи…</div><div class="row"><button id="check" class="secondary">Проверить</button><button id="open" class="secondary">Открыть Factory</button></div><button id="disconnect" class="text">Отключить этот профиль</button><p class="note">Пароли SoundCloud не нужны. Chrome с подключёнными профилями должен быть запущен. Разрешения Codex и запись экрана не используются.</p></main><script src="popup.js"></script></body></html>
